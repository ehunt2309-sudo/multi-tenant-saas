name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore backend/Platform.API/Platform.API/Platform.API.csproj
      - name: Build
        run: dotnet build backend/Platform.API/Platform.API/Platform.API.csproj --no-restore -c Release
      - name: Vulnerable packages check
        run: |
          dotnet list backend/Platform.API/Platform.API/Platform.API.csproj package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then echo "Vulnerable packages found"; exit 1; fi
